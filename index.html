<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f2a43">
<title>B Gallery – IHT Rajshahi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@600;800&family=Hind+Siliguri:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eaf4f6;--card:#fff;--ink:#0f2a43;--mute:#587087;--teal:#0e8f8a;--tint:#d9f2ee;--line:#d6e5e8;--urg:#ffe7ea;--coral:#d93a4a;--bad:#c62828;--shadow:0 12px 32px rgba(15,42,67,.12)}
@media(prefers-color-scheme:dark){:root{--bg:#0a1722;--card:#112433;--ink:#e8f1f6;--mute:#8fa9bb;--teal:#3cc7bf;--tint:#14363a;--line:#1e3a4c;--urg:#3a1c26;--coral:#ff7a85;--bad:#ff8a80;--shadow:0 12px 32px rgba(0,0,0,.4)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.7 "Hind Siliguri",system-ui,sans-serif;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
.hero{position:relative;overflow:hidden;color:#fff;background:linear-gradient(150deg,#0f2a43 0%,#0a6f78 62%,#14a89f 100%);padding:calc(44px + env(safe-area-inset-top)) 22px 82px;border-radius:0 0 34px 34px}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:radial-gradient(circle at 35% 35%,rgba(255,255,255,.28),rgba(255,255,255,0) 70%)}
.hero::before{width:260px;height:260px;right:-70px;top:-60px}
.hero::after{width:180px;height:180px;left:-60px;bottom:-70px}
.hero>*{position:relative;max-width:640px;margin-left:auto;margin-right:auto}
h1{font:800 58px/1.1 "Baloo Da 2","Hind Siliguri",sans-serif;margin:0}
.sub{margin:6px auto 0;font-size:19px;font-weight:500;opacity:.95}
.pill,.chips span{display:inline-block;padding:2px 14px;border-radius:999px;font-size:15px}
.pill{background:rgba(255,255,255,.18);margin-top:12px}
.hero .chips{margin-top:16px}
.hero .chips span{border:1px solid rgba(255,255,255,.4);margin:0 8px 8px 0}
main{position:relative;max-width:640px;margin:-46px auto 0;padding:0 16px}
.card{background:var(--card);border-radius:22px;padding:22px 20px;box-shadow:var(--shadow);margin-bottom:16px}
h2{font:600 26px/1.3 "Baloo Da 2","Hind Siliguri",sans-serif;margin:0 0 6px}
.mute{color:var(--mute);margin:0}
.note{margin-top:12px;padding:12px 16px;border-radius:16px;background:var(--tint)}
.note.urgent{background:var(--urg)}
.note b{font-size:18px}
.note p{margin:2px 0}
.note small{color:var(--mute)}
.tag{display:inline-block;margin-right:8px;padding:0 10px;border-radius:999px;background:var(--coral);color:#fff;font-size:14px}
.soon{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--card);border-radius:20px;padding:16px;box-shadow:var(--shadow)}
.tile i{display:block;font-style:normal;font-size:30px;line-height:1.3}
.tile b{display:block;font-weight:700}
.tile span{display:inline-block;margin-top:4px;padding:0 10px;border-radius:999px;background:var(--tint);color:var(--teal);font-size:14px;font-weight:500}
label{display:block;margin-top:14px;font-weight:500}
input,select{width:100%;height:50px;font:inherit;padding:0 14px;margin-top:4px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
input:focus,select:focus,button:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.go{margin-top:20px;width:100%;height:52px;font:700 18px "Hind Siliguri",sans-serif;border:0;border-radius:14px;background:linear-gradient(135deg,#0a6f78,#14a89f);color:#fff;cursor:pointer}
.go:active{transform:scale(.98)}
.msg{margin:14px 0 0;min-height:1.5em}
.ok{color:var(--teal)}
.bad{color:var(--bad)}
.av{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;font:800 36px "Baloo Da 2",sans-serif;color:#fff;background:linear-gradient(135deg,#0f2a43,#14a89f);margin-bottom:10px}
.who{font:600 28px/1.3 "Baloo Da 2","Hind Siliguri",sans-serif;margin:0}
.chips span{background:var(--tint);color:var(--teal);font-weight:500;margin:10px 8px 0 0}
textarea{width:100%;min-height:96px;font:inherit;padding:12px 14px;margin-top:4px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
textarea:focus{outline:3px solid var(--teal);outline-offset:2px}
.chk{display:flex;gap:10px;align-items:center}
.chk input{width:22px;height:22px;margin:0}
.ghost{margin-top:16px;padding:8px 22px;font:500 16px "Hind Siliguri",sans-serif;border-radius:999px;border:1.5px solid var(--teal);background:none;color:var(--teal);cursor:pointer}
.del{float:right;border:0;background:none;color:var(--bad);font:500 15px "Hind Siliguri",sans-serif;cursor:pointer}
#bar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:4px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:var(--card);box-shadow:0 -8px 28px rgba(15,42,67,.14);border-radius:24px 24px 0 0}
#bar button{flex:1;border:0;background:none;color:var(--mute);font:500 14px/1.3 "Hind Siliguri",sans-serif;padding:6px 2px;border-radius:16px;cursor:pointer}
#bar button i{display:block;font-style:normal;font-size:22px}
#bar button.on{background:var(--tint);color:var(--teal);font-weight:700}
.n-student{color:#2563eb}.n-captain{color:#d97706}.n-super_admin{color:#9333ea}
.note img{display:block;max-width:100%;border-radius:12px;margin:8px 0}

.hero #lang{position:absolute;right:16px;top:calc(14px + env(safe-area-inset-top));margin:0;max-width:none;border:1px solid rgba(255,255,255,.6);background:rgba(255,255,255,.18);color:#fff;border-radius:999px;padding:4px 16px;font:700 15px "Hind Siliguri",sans-serif;cursor:pointer}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px}
.tabs button{border:1.5px solid var(--teal);background:none;color:var(--teal);border-radius:999px;padding:2px 14px;font:500 15px "Hind Siliguri",sans-serif;cursor:pointer}
.tabs button.on{background:var(--teal);color:#fff}
.link{background:none;border:0;color:var(--teal);font:500 16px "Hind Siliguri",sans-serif;text-decoration:underline;cursor:pointer;padding:0;margin-top:12px}
.urow{border-top:1px solid var(--line);padding:10px 0}
.urow select{height:42px;font-size:15px}
.urow .go{height:42px;font-size:16px;margin-top:8px}
.hero .inst{font:700 19px/1.45 "Hind Siliguri",sans-serif;margin:0 auto 8px;padding-right:88px;letter-spacing:.2px}
.hero h1{font-size:54px;text-shadow:0 4px 18px rgba(0,0,0,.25)}
.hero .pill{background:rgba(255,255,255,.22);font-weight:500;padding:3px 16px}
#hn,#nlist{display:grid;gap:12px}
.ncard{background:var(--card);border:1px solid var(--line);border-top:5px solid var(--teal);border-radius:18px;padding:14px 16px;box-shadow:0 6px 18px rgba(15,42,67,.08)}
.ncard.b-dental_radio{border-top-color:#2563eb}.ncard.b-physio{border-top-color:#d97706}.ncard.b-gallery{border-top-color:#9333ea}
.ncard.urgent{background:var(--urg);border-top-color:var(--coral)}
.ncard h3{margin:8px 0 4px;font:700 19px/1.4 "Hind Siliguri",sans-serif}
.ncard p{margin:0 0 8px;white-space:pre-wrap}
.ncard img{display:block;max-width:100%;border-radius:12px;margin:8px 0}
.ncard .meta{font-size:13px;color:var(--mute)}
.bchip{display:inline-block;padding:0 10px;border-radius:999px;font-size:13px;font-weight:500;background:var(--tint);color:var(--teal)}
.tile{cursor:pointer;text-align:center}
.tile i{font-size:34px}
.card h2{padding-left:12px;border-left:5px solid var(--teal)}
.about p small{color:var(--mute)}
@keyframes flow{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes floaty{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-22px) scale(1.08)}}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(217,58,74,.5)}50%{box-shadow:0 0 0 10px rgba(217,58,74,0)}}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
html{min-height:100%;background:linear-gradient(180deg,#dff3f6 0%,#f3e9fb 55%,#fff1e4 100%);background-color:#f3e9fb}
body{background:transparent!important;min-height:100%}
@media(prefers-color-scheme:dark){html{background:linear-gradient(180deg,#0a1722 0%,#1a1030 60%,#26150f 100%);background-color:#1a1030}}
.hero{background:linear-gradient(120deg,#0f2a43,#0a6f78,#7c3aed,#db2777,#f59e0b,#0a6f78);background-size:400% 400%;animation:flow 14s ease infinite}
.hero h1{background:linear-gradient(90deg,#fff,#ffe9a8,#aef3ff,#fff);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:flow 6s linear infinite;text-shadow:none;filter:drop-shadow(0 3px 10px rgba(0,0,0,.3))}
.hero::before{animation:floaty 7s ease-in-out infinite}.hero::after{animation:floaty 9s ease-in-out infinite reverse}
.bub{position:absolute!important;border-radius:50%;background:rgba(255,255,255,.18);animation:floaty 6s ease-in-out infinite}
.hero .chips span{background:rgba(255,255,255,.16);backdrop-filter:blur(4px)}
.card{animation:rise .6s both;border-top:4px solid transparent;background:linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(90deg,#14a89f,#7c3aed,#db2777,#f59e0b) border-box}
.ncard{animation:rise .6s both}.ncard:nth-child(2){animation-delay:.1s}.ncard:nth-child(3){animation-delay:.2s}.ncard:nth-child(n+4){animation-delay:.3s}
.ncard{transition:transform .2s,box-shadow .2s}.ncard:hover{transform:translateY(-4px);box-shadow:0 14px 28px rgba(15,42,67,.18)}
.ncard.urgent{animation:rise .6s both,pulse 2s infinite}
.tile{transition:transform .2s;animation:rise .6s both}.tile:nth-child(1){background:linear-gradient(135deg,#d9f2ee,#fff)}.tile:nth-child(2){background:linear-gradient(135deg,#e6e3ff,#fff)}.tile:nth-child(3){background:linear-gradient(135deg,#ffe3ec,#fff)}.tile:nth-child(4){background:linear-gradient(135deg,#fff0d6,#fff)}
@media(prefers-color-scheme:dark){.tile:nth-child(n){background:var(--card)}}
.tile:hover{transform:translateY(-5px) rotate(-1deg)}.tile i{animation:floaty 3.5s ease-in-out infinite}
.go{background:linear-gradient(90deg,#0a6f78,#7c3aed,#db2777,#0a6f78);background-size:300% 100%;animation:flow 6s linear infinite}
#bar button.on i{animation:pop .4s}
#bar{backdrop-filter:blur(10px)}
.tabs button{transition:all .2s}.tabs button.on{background:linear-gradient(90deg,#0a6f78,#7c3aed);border-color:transparent}
.ph{width:124px;height:124px;margin:10px auto;padding:4px;border-radius:50%;background:conic-gradient(#14a89f,#7c3aed,#db2777,#f59e0b,#14a89f);animation:spin 6s linear infinite}
.ph img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:3px solid var(--card);animation:spin 6s linear infinite reverse}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ===== v5: typography, hero fix, calm photo ===== */
:root{--fs-s:14px;--fs-b:16px;--fs-l:19px;--fs-h2:22px}
body{font-size:var(--fs-b);line-height:1.65;text-align:left}
.hero{text-align:center;padding-top:calc(64px + env(safe-area-inset-top))}
.hero .inst{padding:0;margin:0 auto 4px;font:700 17px/1.5 "Hind Siliguri",sans-serif;letter-spacing:.3px;border-bottom:2px solid rgba(255,255,255,.55);display:inline-block;padding-bottom:4px}
.hero h1{font-size:56px;line-height:1.5;padding:4px 0 10px;margin:4px auto 0;overflow:visible}
.hero .pill{margin-top:6px;font-size:var(--fs-b);font-weight:600;padding:3px 18px}
.hero .chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:18px}
.hero .chips span{margin:0;background:rgba(255,255,255,.2);backdrop-filter:none;-webkit-backdrop-filter:none;border:1px solid rgba(255,255,255,.55);font-size:var(--fs-s);font-weight:600;padding:2px 14px}
.bub{z-index:0}.hero>*:not(.bub){z-index:1}
.card h2{border:0;padding:0 0 10px;margin:0 0 12px;font-size:var(--fs-h2);position:relative}
.card h2::after{content:"";position:absolute;left:0;bottom:0;height:4px;width:56px;border-radius:4px;background:linear-gradient(90deg,#14a89f,#7c3aed,#db2777);animation:grow 1s ease both}
@keyframes grow{from{width:0}to{width:56px}}
label{font-size:15px;font-weight:600;margin-top:14px}
input,select,textarea{font-size:var(--fs-b)}
.go{font-size:17px}.ghost,.link{font-size:var(--fs-b)}
.ncard h3{font-size:var(--fs-l)}.ncard .meta,.bchip,.tag{font-size:13px}
.note b{font-size:var(--fs-b)}
.tabs button{font-size:var(--fs-s);font-weight:600}
.ph{animation:none;width:128px;height:128px;margin:6px auto 12px;padding:4px;background:linear-gradient(135deg,#14a89f,#7c3aed,#db2777);box-shadow:0 8px 22px rgba(124,58,237,.3)}
.ph img{animation:none}
.about .note{text-align:center}
.about .note>b{display:block;font-size:var(--fs-b);text-decoration:underline;text-decoration-color:var(--teal);text-underline-offset:5px;margin-bottom:8px}
.about p{margin:6px 0}
.ic{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.14em;flex:none}
.hero .topbtns{position:absolute;right:16px;top:calc(14px + env(safe-area-inset-top));display:flex;gap:8px;align-items:center;margin:0;max-width:none;z-index:2}
.hero .topbtns #lang{position:static;margin:0}
.ib{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;border:1px solid rgba(255,255,255,.6);background:rgba(255,255,255,.18);color:#fff;font-size:21px;cursor:pointer;padding:0}
.hero .inst{padding-right:0}
#bar i{display:block;font-size:24px;line-height:1;font-style:normal}
.tile i{display:block;font-size:34px;line-height:1.2;color:#0a6f78;font-style:normal}
.av{display:grid;place-items:center;color:#fff}.av .ic{width:44px;height:44px}
.ncard .meta .ic{width:14px;height:14px}
.tabs{flex-wrap:nowrap;gap:6px}
.tabs button{flex:1 1 0;min-width:0;white-space:nowrap;font-size:13px;padding:6px 4px;text-align:center}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></symbol>
<symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></symbol>
<symbol id="i-book" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></symbol>
<symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></symbol>
<symbol id="i-user" viewBox="0 0 24 24"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></symbol>
<symbol id="i-login" viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/></symbol>
<symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></symbol>
<symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></symbol>
<symbol id="i-file" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/></symbol>
<symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></symbol>
</defs></svg>
<header class="hero">
<div class="topbtns"><button id="abtn" class="ib" type="button" data-go="about" aria-label="About"><svg class="ic"><use href="#i-info"/></svg></button><button id="lang" type="button">English</button></div>
<span class="bub" style="width:46px;height:46px;left:8%;top:62%"></span><span class="bub" style="width:28px;height:28px;right:18%;top:48%;animation-delay:1.5s"></span><span class="bub" style="width:64px;height:64px;right:6%;bottom:6%;animation-delay:3s"></span>
<p class="inst" data-i="inst"></p>
<h1 data-i="site"></h1>
<span class="pill" data-i="year"></span>
<div class="chips"><span data-i="d_Physiotherapy"></span><span data-i="d_Dental"></span><span data-i="d_Radiotherapy"></span></div>
</header>
<main>
<div id="home">
<section class="card"><h2 data-i="latest"></h2><div id="hn"></div><button class="ghost" data-go="notice" data-i="allN"></button></section>
</div>

<section class="card" id="notice" hidden><h2 data-i="notices"></h2><div class="tabs" id="tabs"></div><div id="nlist"></div></section>

<section id="res" hidden>
<div class="card" id="gate" hidden><h2 data-i="needReg"></h2><p class="mute" data-i="needRegT"></p><button class="go" data-go="reg" data-i="regBtn"></button><button class="link" data-go="login" data-i="haveAcc"></button></div>
<div class="soon" id="tiles" hidden>
<div class="tile"><i data-ic="calendar"></i><b data-i="t_routine"></b><span data-i="soon"></span></div>
<div class="tile"><i data-ic="book"></i><b data-i="t_books"></b><span data-i="soon"></span></div>
<div class="tile"><i data-ic="file"></i><b data-i="t_sol"></b><span data-i="soon"></span></div>
<div class="tile"><i data-ic="chat"></i><b data-i="t_comm"></b><span data-i="soon"></span></div>
</div>
</section>

<section class="card about" id="about" hidden>
<h2 data-i="about"></h2><p data-i="aboutT"></p>
<div class="note"><b data-i="inst"></b><div id="abInst"></div></div>
<div class="note"><b data-i="madeBy"></b><div id="abMe"></div></div>
</section>

<section class="card" id="reg" hidden>
<h2 data-i="regBtn"></h2><p class="mute" data-i="regT"></p>
<form id="regForm">
<label><span data-i="mobile"></span><input id="rMob" type="tel" inputmode="numeric" autocomplete="tel" placeholder="01XXXXXXXXX" required></label>
<label><span data-i="code"></span><input id="rCode" inputmode="numeric" maxlength="2" placeholder="00" required></label>
<label><span data-i="pass"></span><input id="rPass" type="password" minlength="6" autocomplete="new-password" required></label>
<label><span data-i="you"></span><select id="rGender" required></select></label>
<button class="go" data-i="regBtn"></button><p id="regMsg" class="msg" role="status"></p>
<button type="button" class="link" data-go="login" data-i="haveAcc"></button>
</form>
</section>

<section class="card" id="login" hidden>
<h2 data-i="loginBtn"></h2>
<form id="logForm">
<label><span data-i="mobile"></span><input id="lMob" autocomplete="username" placeholder="01XXXXXXXXX" required></label>
<label><span data-i="pass"></span><input id="lPass" type="password" autocomplete="current-password" required></label>
<button class="go" data-i="loginBtn"></button><p id="logMsg" class="msg" role="status"></p>
<button type="button" class="link" data-go="reg" data-i="noAcc"></button>
</form>
</section>

<section class="card" id="me" hidden>
<div class="av" id="meAv"></div><p class="who" id="meName"></p><div class="chips" id="meChips"></div>
<button class="ghost" id="toAdm" data-go="adm" hidden data-i="admin"></button>
<button class="ghost" id="out2" data-i="logout"></button>
</section>

<section class="card" id="adm" hidden>
<h2 data-i="postN"></h2><p class="mute" id="admHint"></p>
<form id="admForm">
<label><span data-i="whichB"></span><select id="aBoard"></select></label>
<label><span data-i="title"></span><input id="aTitle" required></label>
<label><span data-i="body"></span><textarea id="aBody"></textarea></label>
<label><span data-i="img"></span><input id="aImg" type="file" accept="image/*"></label>
<label class="chk"><input id="aUrg" type="checkbox"><span data-i="urgent"></span></label>
<button class="go" data-i="postBtn"></button><p id="admMsg" class="msg" role="status"></p>
</form>
<h2 style="margin-top:22px" data-i="myN"></h2><div id="admList"></div>
<div id="umgr" hidden>
<h2 style="margin-top:22px" data-i="users"></h2>
<input id="uq" data-p="search"><div id="ulist"></div>
</div>
</section>

let lang=localStorage.getItem("bg_lang")||"bn";
const t=k=>L[lang][k]||k;
const $=id=>document.getElementById(id);
const ic=n=>`<svg class="ic" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const en=s=>s.replace(/[০-৯]/g,d=>"০১২৩৪৫৬৭৮৯".indexOf(d)).trim();
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const msg=(id,k,ok,raw)=>{const e=$(id);e.textContent=k?t(k):"";if(raw){e.appendChild(document.createElement("br"));const m=document.createElement("small");m.textContent="("+raw+")";e.appendChild(m)}e.className="msg "+(ok?"ok":"bad")};
const errKey=(er,c)=>{const m=(er.message||"").toLowerCase();return /fetch|load failed|network/.test(m)?"errNet":m.includes("already")?"errDup":m.includes("database error")?"errDb":(c==="log"&&m.includes("invalid login"))?"errCred":c==="log"?"logFail":"regFail"};
const BOARDS=["gallery","dental_radio","physio"];
const boardOf=d=>{d=(d||"").toLowerCase();return d==="physiotherapy"?"physio":(d==="dental"||d==="radiotherapy")?"dental_radio":null};
const SID="bg_sid";let ME=null,LOGGED=false,CUR="home",NB="gallery";
const dateS=d=>new Date(d).toLocaleDateString(lang==="bn"?"bn-BD":"en-GB");
const mail=m=>m+"@bgallery.com";
const mobOk=m=>/^01[3-9]\d{8}$/.test(m);
const cleanMob=s=>en(s).replace(/[\s-]/g,"");
const noteHTML=n=>`<div class="ncard b-${n.board}${n.is_emergency?" urgent":""}"><span class="bchip">${t("b_"+n.board)}</span>${n.is_emergency?` <span class="tag">${t("urgTag")}</span>`:""}<h3>${esc(n.title)}</h3>${n.body?`<p>${esc(n.body)}</p>`:""}${n.image_url?`<img src="${esc(n.image_url)}" alt="" loading="lazy">`:""}<div class="meta">${ic("calendar")} ${dateS(n.created_at)}</div></div>`;
async function board(b,box,lim){
  const {data,error}=await sb.from("notices").select("title,body,board,image_url,is_emergency,created_at").eq("board",b).order("created_at",{ascending:false}).limit(lim);
  $(box).innerHTML=(error||!data||!data.length)?`<p class="mute">${t("none")}</p>`:data.map(noteHTML).join("");
}
function drawTabs(){$("tabs").innerHTML=BOARDS.map(b=>`<button data-b="${b}" class="${b===NB?"on":""}">${t("tb_"+b)}</button>`).join("")}
$("tabs").onclick=e=>{const b=e.target.closest("button");if(!b)return;NB=b.dataset.b;drawTabs();board(NB,"nlist",30)};
const loadNotices=()=>{board("gallery","hn",3);drawTabs();board(NB,"nlist",30)};
function buildBar(){
  const it=[["home","home","nav_home"],["notice","bell","nav_notice"],["res","book","nav_res"],["acct",LOGGED?"user":"login",LOGGED?"nav_me":"nav_login"]];
  if(LOGGED&&ME&&ME.role!=="student")it.splice(3,0,["adm","shield",ME.role==="super_admin"?"nav_sadm":"nav_cadm"]);
  $("bar").innerHTML=it.map(i=>`<button data-v="${i[0]}"><i>${ic(i[1])}</i>${t(i[2])}</button>`).join("");
  hi();
}
function hi(){const m={reg:"acct",login:"acct",me:"acct"}[CUR]||CUR;document.querySelectorAll("#bar button").forEach(b=>b.classList.toggle("on",b.dataset.v===m))}
function show(v){
  if(v==="res"){$("gate").hidden=LOGGED;$("tiles").hidden=!LOGGED}
  CUR=v;["home","notice","res","about","reg","login","me","adm"].forEach(x=>$(x).hidden=x!==v);hi();window.scrollTo(0,0);
}
function applyLang(){
  document.querySelectorAll("[data-ic]").forEach(e=>e.innerHTML=ic(e.dataset.ic));
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-i]").forEach(e=>e.textContent=t(e.dataset.i));
  document.querySelectorAll("[data-p]").forEach(e=>e.placeholder=t(e.dataset.p));
  $("lang").textContent=lang==="bn"?"English":"বাংলা";
  drawAbout();
  $("rGender").innerHTML=`<option value="">${t("pick")}</option><option value="male">${t("male")}</option><option value="female">${t("female")}</option>`;
  buildBar();loadNotices();drawMe();if(ME&&ME.role!=="student"){setBoards();loadAdmin()}
}
$("lang").onclick=()=>{lang=lang==="bn"?"en":"bn";localStorage.setItem("bg_lang",lang);applyLang()};
document.addEventListener("click",e=>{const g=e.target.closest("[data-go]");if(g)show(g.dataset.go==="acct"?(LOGGED?"me":"login"):g.dataset.go)});
$("bar").onclick=e=>{const b=e.target.closest("button");if(!b)return;const v=b.dataset.v;show(v==="acct"?(LOGGED?"me":"login"):v)};
function drawMe(){admHint();
  if(!ME)return;
  $("meAv").innerHTML=ic("user");
  $("meName").textContent=ME.full_name;$("meName").className="who n-"+ME.role;
  $("meChips").innerHTML=`<span>${esc(t("d_"+ME.department)===("d_"+ME.department)?ME.department:t("d_"+ME.department))}</span>${ME.roll?`<span>${t("roll_")} ${esc(ME.roll)}</span>`:""}<span>${t("R_"+ME.role)}</span>`;
  $("toAdm").hidden=ME.role==="student";
}
function admHint(){const h=$("admHint");if(!h||!ME)return;h.textContent=ME.role==="super_admin"?"সুপার অ্যাডমিন: সব বোর্ডে নোটিশ দিতে ও মুছতে পারবেন, নিচে ব্যবহারকারী ঠিক করতে পারবেন।":"ক্যাপ্টেন: শুধু আপনার নির্ধারিত বোর্ডে নোটিশ দিতে ও নিজের নোটিশ মুছতে পারবেন।"}
const postable=()=>!ME?[]:ME.role==="super_admin"?BOARDS:[ME.captain_of||boardOf(ME.department)].filter(Boolean);
const setBoards=()=>{const v=$("aBoard").value;$("aBoard").innerHTML=postable().map(k=>`<option value="${k}">${t("b_"+k)}</option>`).join("");if(v)$("aBoard").value=v};
async function shrink(f){
  const m=await createImageBitmap(f),r=Math.min(1,1600/Math.max(m.width,m.height));
  const c=document.createElement("canvas");c.width=Math.round(m.width*r);c.height=Math.round(m.height*r);
  c.getContext("2d").drawImage(m,0,0,c.width,c.height);
  return new Promise(ok=>c.toBlob(ok,"image/jpeg",.85));
}
const claim=async()=>{const k=crypto.randomUUID();localStorage.setItem(SID,k);await sb.rpc("claim_session",{sid:k})};
const valid=async()=>{const k=localStorage.getItem(SID);if(!k)return false;const {data}=await sb.rpc("check_session",{sid:k});return data===true};
setInterval(async()=>{const {data:{session}}=await sb.auth.getSession();if(session&&!(await valid())){await sb.auth.signOut();localStorage.removeItem(SID);await refresh();alert(t("kicked"))}},20000);
async function refresh(go){
  const {data:{session}}=await sb.auth.getSession();
  LOGGED=!!session;ME=null;
  if(LOGGED&&!(await valid())){await sb.auth.signOut();localStorage.removeItem(SID);LOGGED=false}
  if(LOGGED){
    let r=await sb.from("profiles").select("full_name,roll,department,role,gender,captain_of").eq("id",session.user.id).single();
    if(r.error)r=await sb.from("profiles").select("full_name,roll,department,role,gender").eq("id",session.user.id).single();
    ME=r.data;
    if(ME&&!go){const b=boardOf(ME.department);if(b)NB=b}
  }
  applyLang();
  show(go||(LOGGED?CUR==="login"||CUR==="reg"?"me":CUR:CUR));
}
$("regForm").onsubmit=async e=>{
  e.preventDefault();const m=cleanMob($("rMob").value);
  if(!mobOk(m)){msg("regMsg","badMob",0);return}
  msg("regMsg","wait",1);
  const {data,error}=await sb.auth.signUp({email:mail(m),password:$("rPass").value,options:{data:{code:en($("rCode").value),gender:$("rGender").value,phone:m}}});
  if(error){msg("regMsg",errKey(error,"reg"),0,error.message);return}
  if(!data.session){msg("regMsg","regOk",1);return}
  await claim();msg("regMsg","",1);await refresh("me");
};
$("logForm").onsubmit=async e=>{
  e.preventDefault();msg("logMsg","wait",1);
  const v=$("lMob").value.trim(),m=cleanMob(v);
  const email=v.includes("@")?v:mail(m);
  const {error}=await sb.auth.signInWithPassword({email,password:$("lPass").value});
  if(error){msg("logMsg",errKey(error,"log"),0,error.message);return}
  await claim();msg("logMsg","",1);await refresh("me");
};
$("out2").onclick=async()=>{await sb.auth.signOut();localStorage.removeItem(SID);await refresh("home")};
async function loadAdmin(){
  const {data}=await sb.from("notices").select("id,title,board,is_emergency,created_at").order("created_at",{ascending:false}).limit(20);
  $("admList").innerHTML=(data&&data.length)?data.map(n=>`<div class="note${n.is_emergency?" urgent":""}"><button class="del" data-id="${n.id}">${t("del")}</button><b>${esc(n.title)}</b><br><small>${esc(t("b_"+n.board))} · ${dateS(n.created_at)}</small></div>`).join(""):`<p class="mute">${t("noneMine")}</p>`;
  $("umgr").hidden=!(ME&&ME.role==="super_admin");
  if(ME&&ME.role==="super_admin")loadUsers();
}
$("admForm").onsubmit=async e=>{
  e.preventDefault();msg("admMsg","wait",1);
  const {data:{session}}=await sb.auth.getSession();
  let url=null;const f=$("aImg").files[0];
  if(f){
    if(!f.type.startsWith("image/")){msg("admMsg","onlyImg",0);return}
    let b;try{b=await shrink(f)}catch(x){msg("admMsg","imgRead",0);return}
    if(!b||b.size>2*1024*1024){msg("admMsg","imgBig",0);return}
    const p=Date.now()+"_"+Math.random().toString(36).slice(2,8)+".jpg";
    const up=await sb.storage.from("uploads").upload(p,b,{contentType:"image/jpeg"});
    if(up.error){msg("admMsg","imgFail",0);return}
    url=sb.storage.from("uploads").getPublicUrl(p).data.publicUrl;
  }
  const {error}=await sb.from("notices").insert({title:$("aTitle").value.trim(),body:$("aBody").value.trim(),board:$("aBoard").value,image_url:url,is_emergency:$("aUrg").checked,created_by:session.user.id});
  if(error){msg("admMsg","postFail",0);return}
  $("admForm").reset();msg("admMsg","postOk",1);loadAdmin();loadNotices();
};
$("admList").onclick=async e=>{
  const b=e.target.closest(".del");if(!b||!confirm(t("delQ")))return;
  const {error}=await sb.from("notices").delete().eq("id",b.dataset.id);
  if(!error){loadAdmin();loadNotices()}
};
// ===== সুপার অ্যাডমিন: ব্যবহারকারী ব্যবস্থাপনা =====
async function loadUsers(){
  const q=$("uq").value.replace(/[,%()*]/g,"").trim();
  let r=sb.from("profiles").select("id,full_name,roll,phone,department,role,captain_of").order("roll").limit(40);
  if(q)r=r.or(`full_name.ilike.%${q}%,roll.ilike.%${q}%`);
  const {data}=await r;
  const ro=["student","captain","super_admin"];
  $("ulist").innerHTML=(data||[]).map(u=>`<div class="urow" data-id="${u.id}"><b>${esc(u.full_name)}</b> <small>${esc(u.roll||u.phone||"")} · ${esc(u.department||"")}</small>
<select class="ur">${ro.map(x=>`<option value="${x}"${x===u.role?" selected":""}>${t("R_"+x)}</option>`).join("")}</select>
<select class="uc"><option value="">${t("noCap")}</option>${BOARDS.map(x=>`<option value="${x}"${x===u.captain_of?" selected":""}>${t("b_"+x)}</option>`).join("")}</select>
<button class="go us">${t("save")}</button></div>`).join("");
}
let ut;$("uq").oninput=()=>{clearTimeout(ut);ut=setTimeout(loadUsers,350)};
$("ulist").onclick=async e=>{
  const b=e.target.closest(".us");if(!b)return;const row=b.closest(".urow");
  const role=row.querySelector(".ur").value,cap=row.querySelector(".uc").value||null;
  const {error}=await sb.from("profiles").update({role,captain_of:role==="captain"?cap:null}).eq("id",row.dataset.id);
  b.textContent=error?"×":t("saved");setTimeout(()=>b.textContent=t("save"),1500);
};
refresh("home");
</script>
